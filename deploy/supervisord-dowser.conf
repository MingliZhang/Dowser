# Run Dowser inside an existing container, next to MeTube and friends.
#
# Drop this into the container's supervisor include directory (commonly
# /etc/supervisor/conf.d/ or /etc/supervisor.d/) and reload:
#
#   supervisorctl reread && supervisorctl update && supervisorctl status dowser
#
# The container needs ffmpeg, plus Chromium and its libraries for network
# capture. If installing Chromium there is not practical, set ENABLE_SNIFFER
# to false and Dowser falls back to the yt-dlp extractor path only — which
# gives up most of what makes it useful, so prefer installing it:
#
#   pip install -r requirements.txt && python -m playwright install --with-deps chromium

[program:dowser]
command=/opt/dowser/.venv/bin/python -m app.main
directory=/opt/dowser
autostart=true
autorestart=true
startsecs=10
startretries=5

# Clean shutdown so ffmpeg children die with the parent.
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true

user=abc
priority=25

environment=
    HOST="0.0.0.0",
    PORT="8477",
    DOWNLOAD_DIR="/downloads",
    STATE_FILE="/config/dowser/state.json",
    SETTINGS_FILE="/config/dowser/settings.json"

# Log to the container's stdout/stderr so `docker logs` picks them up.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
